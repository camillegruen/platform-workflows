# Needs a GitHub environment named "prod" with variables
# DEPLOYMENT_ROLE_ARN and AWS_REGION. Add "Required reviewers"
# to the environment to require approval before apply runs.
name: Terraform apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: YOUR_ORG/shared-workflows/.github/workflows/tf-apply.yml@v1
    permissions:
      id-token: write
      contents: read
    secrets: inherit
    with:
      environment: prod
      working-directory: infra
      init-args: -backend-config=backend-prod.hcl
      plan-args: -var-file=prod.tfvars
