name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-validation:
    uses: YOUR_ORG/platform-workflows/.github/workflows/pr-validation.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      validate-title: true
      auto-assign: true
