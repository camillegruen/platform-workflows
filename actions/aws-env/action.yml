name: AWS environment
description: >
  Export the caller's secrets and vars as environment variables for later steps,
  then assume the deployment role via OIDC.

inputs:
  secrets-json:
    description: "Pass `toJson(secrets)`. Leave empty to export nothing from secrets."
    required: false
    default: "{}"
  vars-json:
    description: "Pass `toJson(vars)`."
    required: false
    default: "{}"
  role-arn:
    description: IAM role to assume.
    required: true
  region:
    description: AWS region.
    required: true
  role-session-name:
    description: STS session name.
    required: false
    default: github-actions

runs:
  using: composite
  steps:
    - name: Export secrets and vars to GITHUB_ENV
      shell: python
      env:
        SECRETS_JSON: ${{ inputs.secrets-json }}
        VARS_JSON: ${{ inputs.vars-json }}
      run: |
        import json, os, secrets as rnd

        values = {**json.loads(os.environ["SECRETS_JSON"] or "{}"),
                  **json.loads(os.environ["VARS_JSON"] or "{}")}
        values.pop("github_token", None)  # already available as github.token

        with open(os.environ["GITHUB_ENV"], "a") as env_file:
            for name, value in values.items():
                value = str(value)
                if "\n" in value:
                    # Random delimiter so a value containing "EOF" can't end the block early
                    delim = f"ghadelim_{rnd.token_hex(8)}"
                    print(f"{name}<<{delim}\n{value}\n{delim}", file=env_file)
                else:
                    print(f"{name}={value}", file=env_file)

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885  # v6.1.1
      with:
        aws-region: ${{ inputs.region }}
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ${{ inputs.role-session-name }}
