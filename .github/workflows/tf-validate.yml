name: Terraform Validate Reusable Workflow

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: "."
      terraform-version:
        required: false
        type: string
        default: "1.9.8"
      tflint-version:
        required: false
        type: string
        default: "v0.66.0"
      tflint-config:
        required: false
        type: string
        default: ""
        description: Path to .tflint.hcl relative to the repo root (empty = look in working-directory).

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Terraform setup
        uses: YOUR_ORG/platform-workflows/actions/tf-setup@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          terraform-version: ${{ inputs.terraform-version }}
          cloud-auth: "false"
          init: no-backend

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337  # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }} 
          TFLINT_CONFIG: ${{ inputs.tflint-config }}
        run: |
          args=()
          [[ -n "$TFLINT_CONFIG" ]] && args+=("--config=$GITHUB_WORKSPACE/$TFLINT_CONFIG")
          tflint --init "${args[@]}"
          tflint --recursive --format compact "${args[@]}"
